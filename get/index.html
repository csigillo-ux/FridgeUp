<style>
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #eef0f9; font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #1e2140; text-align: center; }
a { color: #3a3f6b; }
p { margin: 10px 0; font-size: 17px; }

<script>
(function () {
  var ua = navigator.userAgent || "";
  var target = "/";
  if (/android/i.test(ua)) {
    target = "https://play.google.com/store/apps/details?id=com.csigillo.fridgeup";
  } else if (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) {
    target = "https://apps.apple.com/app/id6779924343";
  }
  window.location.replace(target);
})();
</script>
</head>
